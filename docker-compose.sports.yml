# Sports Prediction Agent — services additionnels à greffer au stack existant
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sports.yml up -d
#
# Ou, si tu veux gérer ce stack séparément :
#   docker compose -f docker-compose.sports.yml --env-file .env up -d

services:

  # ── PostgreSQL dédié prédictions ─────────────────────────────────────────
  postgres-sports:
    image: postgres:16-alpine
    container_name: postgres-sports
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_sports_data:/var/lib/postgresql/data
      - ./predictor/src/db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - sports-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (LLM local, GPU GTX 1650) ──────────────────────────────────────
  # Prérequis hôte : nvidia-container-toolkit installé + docker daemon configuré
  # Vérifier : docker run --rm --gpus all nvidia/cuda:12.0-base-ubuntu22.04 nvidia-smi
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sports-net
    # GPU passthrough — commenter les 6 lignes suivantes si pas de NVIDIA toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Pull du modèle au premier démarrage (idempotent, skip si déjà présent)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        OLLAMA_PID=$$!
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 2; done
        echo "Pulling ${OLLAMA_MODEL:-llama3.2:3b}..."
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
        wait $$OLLAMA_PID

  # ── Predictor (Python — ingestion, features, ML) ──────────────────────────
  predictor:
    build:
      context: ./predictor
      dockerfile: Dockerfile
    container_name: predictor
    restart: unless-stopped
    depends_on:
      postgres-sports:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      POSTGRES_URL: postgresql://sports:${POSTGRES_PASSWORD}@postgres-sports:5432/sports
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      MODEL_STORAGE_PATH: /models
      INGESTION_HOUR_UTC: ${INGESTION_HOUR_UTC:-6}
      RETRAIN_WEEKDAY: ${RETRAIN_WEEKDAY:-mon}
      RETRAIN_HOUR_UTC: ${RETRAIN_HOUR_UTC:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PREDICTOR_URL: http://predictor:8080
    volumes:
      - predictor_models:/models
    networks:
      - sports-net
    expose:
      - "8080"

  # ── Dashboard Next.js ─────────────────────────────────────────────────────
  sports-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sports-dashboard
    restart: unless-stopped
    depends_on:
      postgres-sports:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://sports:${POSTGRES_PASSWORD}@postgres-sports:5432/sports
      PREDICTOR_URL: http://predictor:8080
    networks:
      - sports-net
    expose:
      - "3000"
    # Cloudflared : créer un tunnel nommé "sports-dashboard" pointant sur ce container
    # Pas besoin de ports: exposés publiquement ici — cloudflared gère l'accès

volumes:
  postgres_sports_data:
  ollama_models:
  predictor_models:

networks:
  sports-net:
    driver: bridge
    # Pour joindre ce réseau depuis d'autres containers de ton stack existant :
    # ajoute "sports-net" dans leurs networks et déclare-le en external si besoin
